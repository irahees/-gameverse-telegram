<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101321">
<title>GameVerse — Play Together</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#101321;--panel:#191f33;--panel2:#222a43;--text:#f5f6ff;--muted:#9ca6c5;--accent:#8b7cff;--mint:#5de0bd;--line:#303956}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% -10%,#35305f 0,transparent 38%),var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button{font:inherit;color:inherit;cursor:pointer}.wrap{max-width:760px;margin:auto;padding:22px 17px 40px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:850;letter-spacing:-1px;font-size:24px}.brand span{color:var(--accent)}.avatar{width:40px;height:40px;border-radius:14px;background:var(--panel2);display:grid;place-items:center}.hero{padding:28px 0 20px}.eyebrow{color:var(--mint);font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.hero h1{font-size:clamp(31px,8vw,48px);line-height:1.04;letter-spacing:-2px;margin:9px 0}.hero p{color:var(--muted);margin:10px 0 0}.chips{display:flex;gap:8px;overflow:auto;padding:8px 0 18px}.chip{border:1px solid var(--line);background:transparent;padding:8px 14px;border-radius:99px;white-space:nowrap;color:var(--muted);font-size:13px}.chip.active{background:var(--accent);border-color:var(--accent);color:white}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:10px 0 13px}.sectionhead h2{font-size:19px;margin:0}.sectionhead small{color:var(--muted)}.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.game{border:1px solid var(--line);background:linear-gradient(145deg,var(--panel2),var(--panel));border-radius:20px;padding:16px;text-align:left;min-height:150px;transition:transform .15s,border-color .15s}.game:active{transform:scale(.98)}.game .emoji{font-size:32px}.game h3{margin:10px 0 3px;font-size:16px}.game p{margin:0;color:var(--muted);font-size:12px}.tag{display:inline-block;margin-top:11px;color:var(--mint);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.7px}.game.wide{grid-column:span 2;min-height:125px}.footer{text-align:center;color:var(--muted);font-size:12px;margin:25px 0}.screen{display:none}.screen.show{display:block}.back{border:0;background:var(--panel2);padding:9px 13px;border-radius:12px;margin:4px 0 18px}.gamepanel{background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:20px;text-align:center}.gamepanel h2{margin:0 0 6px}.sub{color:var(--muted);font-size:13px;margin:0 0 15px}.primary,.secondary{border:0;border-radius:13px;padding:11px 16px;background:var(--accent);font-weight:750;margin:5px}.secondary{background:var(--panel2)}.board{display:grid;gap:7px;margin:15px auto;max-width:340px}.board.grid4{grid-template-columns:repeat(4,1fr)}.cell{aspect-ratio:1;border:0;border-radius:10px;background:#303956;font-size:23px;font-weight:850}.cell.filled{background:#7668d9}.score{color:var(--mint);font-weight:800}.canvas{width:min(100%,340px);aspect-ratio:1;background:#0c1020;border-radius:15px;touch-action:none}.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:16px auto}.ttt button{aspect-ratio:1;border:1px solid var(--line);background:var(--panel2);border-radius:15px;font-size:34px;font-weight:850}.bubblearea{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:330px;margin:20px auto}.bubble{aspect-ratio:1;border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b6aaff,#6756d5 70%);box-shadow:inset -4px -5px 9px #342b80}.bubble.popped{visibility:hidden}.hint{color:var(--muted);font-size:12px;margin-top:12px}@media(min-width:600px){.games{grid-template-columns:repeat(3,minmax(0,1fr))}.game.wide{grid-column:span 1}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div class="brand">GAME<span>VERSE</span></div><div class="avatar">🎮</div></header>
<main id="home">
<section class="hero"><div class="eyebrow">Your little world of games</div><h1>Play a little.<br>Feel a lot.</h1><p>Quick games, clever puzzles and chill moments — all in one place.</p></section>
<nav class="chips"><button class="chip active" data-filter="all">All games</button><button class="chip" data-filter="arcade">Arcade</button><button class="chip" data-filter="puzzle">Puzzle</button><button class="chip" data-filter="relax">Relax</button><button class="chip" data-filter="two">2 Players</button></nav>
<div class="sectionhead"><h2>Explore games</h2><small>4 games ready to play</small></div>
<section class="games">
<button class="game" data-game="snake" data-category="arcade"><div class="emoji">🐍</div><h3>Snake</h3><p>Eat, grow, beat your best.</p><span class="tag">Arcade · Solo</span></button>
<button class="game" data-game="2048" data-category="puzzle"><div class="emoji">🔢</div><h3>2048</h3><p>Merge tiles to reach 2048.</p><span class="tag">Puzzle · Solo</span></button>
<button class="game" data-game="ttt" data-category="two"><div class="emoji">⭕</div><h3>Tic-Tac-Toe</h3><p>A quick match for two.</p><span class="tag">2 Players</span></button>
<button class="game wide" data-game="bubble" data-category="relax"><div class="emoji">🫧</div><h3>Bubble Pop</h3><p>Tap bubbles and take a tiny break.</p><span class="tag">Relax · No timer</span></button>
</section><div class="footer">Made for fun. No pressure, just play ✨</div>
</main>
<section id="play" class="screen"><button class="back" id="back">← All games</button><div class="gamepanel" id="gamepanel"></div></section>
</div>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#101321');tg.setBackgroundColor('#101321')}catch(e){}}
const home=document.getElementById('home'),play=document.getElementById('play'),panel=document.getElementById('gamepanel');
document.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));ch.classList.add('active');document.querySelectorAll('.game').forEach(g=>g.style.display=ch.dataset.filter==='all'||g.dataset.category===ch.dataset.filter?'block':'none')});
document.querySelectorAll('.game').forEach(g=>g.onclick=()=>openGame(g.dataset.game));
document.getElementById('back').onclick=()=>{play.classList.remove('show');home.style.display='block';if(window.snakeTimer)clearInterval(window.snakeTimer)};
function shell(title,desc,body){home.style.display='none';play.classList.add('show');panel.innerHTML='<h2>'+title+'</h2><p class="sub">'+desc+'</p>'+body}
function openGame(id){if(window.snakeTimer)clearInterval(window.snakeTimer);if(id==='2048')game2048();if(id==='ttt')gameTTT();if(id==='bubble')gameBubble();if(id==='snake')gameSnake()}
function game2048(){let a=Array(16).fill(0),score=0;const body='<div class="score">Score: <b id="score">0</b></div><div class="board grid4" id="board"></div><button class="secondary" id="reset">New game</button><p class="hint">Swipe or use arrow keys to move tiles.</p>';shell('2048','Join matching numbers and reach the big tile.',body);const board=document.getElementById('board');function add(){let e=a.map((v,i)=>v?null:i).filter(v=>v!==null);if(e.length)a[e[Math.floor(Math.random()*e.length)]]=Math.random()<.9?2:4}function draw(){board.innerHTML=a.map(v=>'<button class="cell '+(v?'filled':'')+'">'+(v||'')+'</button>').join('');document.getElementById('score').textContent=score}function move(dir){let old=a.join(',');for(let n=0;n<4;n++){let ids=Array.from({length:4},(_,i)=>dir==='left'?n*4+i:dir==='right'?n*4+3-i:dir==='up'?i*4+n:(3-i)*4+n);let vals=ids.map(i=>a[i]).filter(Boolean),out=[];for(let i=0;i<vals.length;i++){if(vals[i]===vals[i+1]){out.push(vals[i]*2);score+=vals[i]*2;i++}else out.push(vals[i])}while(out.length<4)out.push(0);ids.forEach((id,i)=>a[id]=out[i])}if(old!==a.join(',')){add();draw()}}function key(e){if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();move(e.key.slice(5).toLowerCase())}}document.addEventListener('keydown',key);let sx=0,sy=0;board.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};board.ontouchend=e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>20)move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')};document.getElementById('reset').onclick=()=>{a.fill(0);score=0;add();add();draw()};add();add();draw();play.dataset.cleanup='2048';}
function gameTTT(){let a=Array(9).fill(''),turn='X',done=false;const body='<div id="turn">X goes first</div><div class="ttt" id="ttt"></div><div id="result" class="score"></div><button class="secondary" id="again">Play again</button>';shell('Tic-Tac-Toe','Take turns on the same device.',body);const grid=document.getElementById('ttt');function draw(){grid.innerHTML=a.map((v,i)=>'<button data-i="'+i+'">'+v+'</button>').join('');grid.querySelectorAll('button').forEach(b=>b.onclick=()=>playAt(+b.dataset.i));document.getElementById('turn').textContent=done?'Match finished':turn+'’s turn'}function playAt(i){if(done||a[i])return;a[i]=turn;let wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let win=wins.some(w=>w.every(n=>a[n]===turn));if(win||a.every(Boolean)){done=true;document.getElementById('result').textContent=win?turn+' wins! 🎉':'It’s a draw!'}else turn=turn==='X'?'O':'X';draw()}document.getElementById('again').onclick=()=>{a.fill('');turn='X';done=false;document.getElementById('result').textContent='';draw()};draw()}
function gameBubble(){const body='<div class="score" id="count">Popped: 0</div><div class="bubblearea" id="bubbles"></div><button class="secondary" id="refresh">Refresh bubbles</button><p class="hint">No timer. Just pop at your own pace.</p>';shell('Bubble Pop','A little satisfying break.',body);let count=0;const area=document.getElementById('bubbles');function fill(){area.innerHTML=Array.from({length:15},()=>'<button class="bubble" aria-label="Pop bubble"></button>').join('');area.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(!b.classList.contains('popped')){b.classList.add('popped');count++;document.getElementById('count').textContent='Popped: '+count}})}document.getElementById('refresh').onclick=fill;fill()}
function gameSnake(){const body='<div class="score" id="snakeScore">Score: 0</div><canvas class="canvas" id="snakeCanvas" width="340" height="340"></canvas><div><button class="secondary" id="snakeStart">Start / Restart</button></div><p class="hint">Use arrow keys or swipe to steer. Avoid the walls and your tail.</p>';shell('Snake','Eat the dots and grow your snake.',body);const c=document.getElementById('snakeCanvas'),ctx=c.getContext('2d');let snake,dir,food,score,timer,over;function reset(){clearInterval(timer);snake=[{x:8,y:8},{x:7,y:8},{x:6,y:8}];dir={x:1,y:0};food={x:14,y:10};score=0;over=false;draw();timer=setInterval(tick,125);window.snakeTimer=timer}function draw(){ctx.fillStyle='#0c1020';ctx.fillRect(0,0,340,340);ctx.fillStyle='#f2bd69';ctx.fillRect(food.x*20+2,food.y*20+2,16,16);snake.forEach((p,i)=>{ctx.fillStyle=i?'#5de0bd':'#a8fff0';ctx.fillRect(p.x*20+1,p.y*20+1,18,18)});document.getElementById('snakeScore').textContent='Score: '+score+(over?' · Game over':'')}function tick(){let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=17||h.y>=17||snake.some(p=>p.x===h.x&&p.y===h.y)){over=true;clearInterval(timer);draw();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;food={x:Math.floor(Math.random()*17),y:Math.floor(Math.random()*17)}}else snake.pop();draw()}function steer(x,y){if(x!==-dir.x||y!==-dir.y)dir={x,y}}document.onkeydown=e=>{if(!play.classList.contains('show'))return;if(e.key==='ArrowUp')steer(0,-1);if(e.key==='ArrowDown')steer(0,1);if(e.key==='ArrowLeft')steer(-1,0);if(e.key==='ArrowRight')steer(1,0)};let sx=0,sy=0;c.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};c.ontouchend=e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>15)steer(Math.abs(dx)>Math.abs(dy)?dx>0?1:-1:0,Math.abs(dy)>Math.abs(dx)?dy>0?1:-1:0)};document.getElementById('snakeStart').onclick=reset;reset()}
</script>
</body>
</html>
