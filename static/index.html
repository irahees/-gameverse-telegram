<style>
:root{color-scheme:dark;--bg:#101321;--panel:#191f33;--panel2:#222a43;--text:#f5f6ff;--muted:#9ca6c5;--accent:#8b7cff;--mint:#5de0bd;--line:#303956}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% -10%,#35305f 0,transparent 38%),var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input{font:inherit;color:inherit}button{cursor:pointer}.wrap{max-width:850px;margin:auto;padding:19px 16px 40px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:-1px;font-size:24px}.brand span{color:var(--accent)}.topright{display:flex;align-items:center;gap:8px}.avatar{width:40px;height:40px;border-radius:14px;background:var(--panel2);display:grid;place-items:center}.status{font-size:11px;color:var(--mint);border:1px solid var(--line);padding:6px 9px;border-radius:99px}.hero{padding:26px 0 15px}.eyebrow{color:var(--mint);font-size:11px;font-weight:850;letter-spacing:1.5px;text-transform:uppercase}.hero h1{font-size:clamp(32px,8vw,49px);line-height:1.02;letter-spacing:-2px;margin:9px 0}.hero p{color:var(--muted);margin:10px 0 0;max-width:520px}.tools{display:flex;gap:9px;margin:16px 0}.search{min-width:0;flex:1;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px 13px;outline:none}.search:focus{border-color:var(--accent)}.install{display:none;border:0;background:var(--accent);border-radius:13px;padding:10px 13px;font-weight:800}.chips{display:flex;gap:8px;overflow:auto;padding:7px 0 18px;scrollbar-width:none}.chip{border:1px solid var(--line);background:transparent;padding:8px 13px;border-radius:99px;white-space:nowrap;color:var(--muted);font-size:13px}.chip.active{background:var(--accent);border-color:var(--accent);color:white}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:7px 0 13px}.sectionhead h2{font-size:19px;margin:0}.sectionhead small{color:var(--muted)}.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.game{border:1px solid var(--line);background:linear-gradient(145deg,var(--panel2),var(--panel));border-radius:18px;padding:15px;text-align:left;min-height:145px;transition:transform .15s,border-color .15s}.game:active{transform:scale(.98)}.game .emoji{font-size:30px}.game h3{margin:9px 0 3px;font-size:15px}.game p{margin:0;color:var(--muted);font-size:12px}.tag{display:inline-block;margin-top:10px;color:var(--mint);font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.6px}.footer{text-align:center;color:var(--muted);font-size:12px;margin:25px 0}.screen{display:none}.screen.show{display:block}.back{border:0;background:var(--panel2);padding:9px 13px;border-radius:12px;margin:4px 0 15px}.gamepanel{background:var(--panel);border:1px solid var(--line);padding:15px;border-radius:20px;text-align:center;overflow:hidden}.gamepanel h2{margin:0 0 6px}.sub{color:var(--muted);font-size:13px;margin:0 0 15px}.primary,.secondary{border:0;border-radius:13px;padding:11px 16px;background:var(--accent);font-weight:750;margin:5px}.secondary{background:var(--panel2)}.board{display:grid;gap:7px;margin:15px auto;max-width:340px}.grid4{grid-template-columns:repeat(4,1fr)}.cell{aspect-ratio:1;border:0;border-radius:10px;background:#303956;font-size:21px;font-weight:850}.cell.filled{background:#7668d9}.score{color:var(--mint);font-weight:800}.canvas{width:min(100%,340px);aspect-ratio:1;background:#0c1020;border-radius:15px;touch-action:none}.ttt,.connect{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:16px auto}.ttt button{aspect-ratio:1;border:1px solid var(--line);background:var(--panel2);border-radius:15px;font-size:34px;font-weight:850}.connect{grid-template-columns:repeat(7,1fr);max-width:420px;background:#344a9b;padding:8px;border-radius:13px;gap:5px}.connect button{aspect-ratio:1;border:0;border-radius:50%;background:#17213f;font-size:0}.connect button.red{background:#ff6d83}.connect button.yellow{background:#ffdc70}.bubblearea{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:330px;margin:20px auto}.bubble{aspect-ratio:1;border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b6aaff,#6756d5 70%);box-shadow:inset -4px -5px 9px #342b80}.bubble.popped{visibility:hidden}.hint{color:var(--muted);font-size:12px;margin-top:12px}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:340px;margin:15px auto}.memory button{aspect-ratio:1;border:1px solid var(--line);background:var(--panel2);border-radius:12px;font-size:25px}.maze{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;max-width:340px;margin:12px auto;background:#303956;padding:5px;border-radius:10px}.maze span{aspect-ratio:1;border-radius:3px;background:#1a2034}.maze span.wall{background:#7770c9}.maze span.player{background:#5de0bd}.maze span.goal{background:#ffcf70}.controls{display:grid;grid-template-columns:repeat(3,48px);justify-content:center;gap:5px;margin:12px}.controls button{height:42px;border:0;border-radius:10px;background:var(--panel2)}.controls button:nth-child(1){grid-column:2}.controls button:nth-child(2){grid-column:1;grid-row:2}.controls button:nth-child(3){grid-column:2;grid-row:2}.controls button:nth-child(4){grid-column:3;grid-row:2}.racebar{height:18px;background:#303956;border-radius:99px;margin:10px 0;overflow:hidden}.racebar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#5de0bd,#8b7cff);border-radius:99px}.tapbtn{width:100%;max-width:280px;padding:20px;border:0;border-radius:18px;background:linear-gradient(135deg,#8b7cff,#5d50b9);font-size:20px;font-weight:900}.colorpad{display:grid;grid-template-columns:repeat(2, minmax(0,100px));gap:9px;justify-content:center;margin:18px}.colorpad button{height:90px;border:0;border-radius:18px;opacity:.85}.colorpad button:active{opacity:1;transform:scale(.97)}.empty{color:var(--muted);text-align:center;padding:25px}.footer a{color:var(--mint)}@media(min-width:600px){.games{grid-template-columns:repeat(3,minmax(0,1fr))}.wrap{padding-left:22px;padding-right:22px}}
</style>

<body>
<div class="wrap">
<header class="top"><div class="brand">GAME<span>VERSE</span></div><div class="topright"><div id="net" class="status">● Checking…</div><div class="avatar">🎮</div></div></header>
<main id="home">
<section class="hero"><div class="eyebrow">Your world. Your games.</div><h1>Play together.<br>Explore endlessly.</h1><p>Two-player fun, adventures, racing, brain puzzles and relaxing games — all in one place.</p></section>
<div class="tools"><input id="search" class="search" placeholder="Search games…" aria-label="Search games"><button id="install" class="install">Install</button></div>
<nav class="chips" id="filters">
<button class="chip active" data-filter="all">🌟 All</button><button class="chip" data-filter="two">👥 2 Players</button><button class="chip" data-filter="adventure">🗺️ Adventure</button><button class="chip" data-filter="racing">🏁 Racing</button><button class="chip" data-filter="puzzle">🧩 Puzzle</button><button class="chip" data-filter="relax">🫧 Anti-stress</button>
</nav>
<div class="sectionhead"><h2 id="listtitle">Explore games</h2><small id="count">10 games</small></div>
<section class="games" id="games">
<button class="game" data-game="ttt" data-cats="two"><div class="emoji">⭕</div><h3>Tic-Tac-Toe</h3><p>Classic quick match for two.</p><span class="tag">2 Players · Local</span></button>
<button class="game" data-game="connect" data-cats="two puzzle"><div class="emoji">🔴</div><h3>Connect Four</h3><p>Line up four discs to win.</p><span class="tag">2 Players · Strategy</span></button>
<button class="game" data-game="reaction" data-cats="two"><div class="emoji">⚡</div><h3>Reaction Duel</h3><p>Who taps first after GO?</p><span class="tag">2 Players · Reflex</span></button>
<button class="game" data-game="maze" data-cats="adventure puzzle"><div class="emoji">🗝️</div><h3>Maze Quest</h3><p>Find your way to the exit.</p><span class="tag">Adventure · Solo</span></button>
<button class="game" data-game="snake" data-cats="adventure"><div class="emoji">🐍</div><h3>Snake Run</h3><p>Collect dots and keep growing.</p><span class="tag">Adventure · Arcade</span></button>
<button class="game" data-game="race" data-cats="racing two"><div class="emoji">🏎️</div><h3>Tap Racer</h3><p>Race the timer or challenge a friend.</p><span class="tag">Racing · 1–2 Players</span></button>
<button class="game" data-game="2048" data-cats="puzzle"><div class="emoji">🔢</div><h3>2048</h3><p>Merge matching number tiles.</p><span class="tag">Puzzle · Solo</span></button>
<button class="game" data-game="memory" data-cats="puzzle"><div class="emoji">🧠</div><h3>Memory Match</h3><p>Find all matching pairs.</p><span class="tag">Puzzle · Solo</span></button>
<button class="game" data-game="bubble" data-cats="relax"><div class="emoji">🫧</div><h3>Bubble Pop</h3><p>Pop bubbles at your own pace.</p><span class="tag">Anti-stress · No timer</span></button>
<button class="game" data-game="colors" data-cats="relax puzzle"><div class="emoji">🎨</div><h3>Color Flow</h3><p>Repeat a gentle color pattern.</p><span class="tag">Relax · Focus</span></button>
</section><div class="footer">Made for fun. No pressure, just play ✨<br><span id="offlineNote">Offline play is available after the first successful load.</span></div>
</main>
<section id="play" class="screen"><button class="back" id="back">← All games</button><div class="gamepanel" id="gamepanel"></div></section>
</div>
<script>
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#101321');tg.setBackgroundColor('#101321')}catch(e){}}
const home=document.getElementById('home'),play=document.getElementById('play'),panel=document.getElementById('gamepanel');
let currentFilter='all',deferredInstall=null,cleanup=null;
const allCards=[...document.querySelectorAll('.game')];
function filterGames(){const q=document.getElementById('search').value.toLowerCase().trim();let n=0;allCards.forEach(c=>{const ok=(currentFilter==='all'||c.dataset.cats.split(' ').includes(currentFilter))&&(!q||c.innerText.toLowerCase().includes(q));c.style.display=ok?'block':'none';if(ok)n++});document.getElementById('count').textContent=n+' games';document.getElementById('listtitle').textContent=currentFilter==='all'?'Explore games':document.querySelector('[data-filter="'+currentFilter+'"]').textContent}
document.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));ch.classList.add('active');currentFilter=ch.dataset.filter;filterGames()});
document.getElementById('search').oninput=filterGames;
allCards.forEach(c=>c.onclick=()=>openGame(c.dataset.game));
function stopGame(){if(cleanup){cleanup();cleanup=null}}
document.getElementById('back').onclick=()=>{stopGame();play.classList.remove('show');home.style.display='block'};
function shell(title,desc,body){home.style.display='none';play.classList.add('show');panel.innerHTML='<h2>'+title+'</h2><p class="sub">'+desc+'</p>'+body}
function openGame(id){stopGame();({ttt:gameTTT,connect:gameConnect,reaction:gameReaction,maze:gameMaze,snake:gameSnake,race:gameRace,'2048':game2048,memory:gameMemory,bubble:gameBubble,colors:gameColors}[id]||(()=>{}))()}
function gameTTT(){let a=Array(9).fill(''),turn='X',done=false;const body='<div id="turn">X goes first</div><div class="ttt" id="ttt"></div><div id="result" class="score"></div><button class="secondary" id="again">Play again</button>';shell('Tic-Tac-Toe','Two players take turns on this device.',body);const grid=document.getElementById('ttt');function draw(){grid.innerHTML=a.map((v,i)=>'<button data-i="'+i+'">'+v+'</button>').join('');grid.querySelectorAll('button').forEach(b=>b.onclick=()=>at(+b.dataset.i));document.getElementById('turn').textContent=done?'Match finished':turn+'’s turn'}function at(i){if(done||a[i])return;a[i]=turn;const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]],win=wins.some(w=>w.every(n=>a[n]===turn));if(win||a.every(Boolean)){done=true;document.getElementById('result').textContent=win?turn+' wins! 🎉':'Draw!'}else turn=turn==='X'?'O':'X';draw()}document.getElementById('again').onclick=()=>{a.fill('');turn='X';done=false;document.getElementById('result').textContent='';draw()};draw()}
function gameConnect(){let a=Array(42).fill(0),turn=1,done=false;const body='<div id="cstatus">Red goes first</div><div class="connect" id="connect"></div><div id="cresult" class="score"></div><button class="secondary" id="crestart">Restart</button>';shell('Connect Four','Drop four discs in a row to win.',body);const el=document.getElementById('connect');function draw(){el.innerHTML=a.map((v,i)=>'<button class="'+(v===1?'red':v===2?'yellow':'')+'" data-col="'+(i%7)+'" aria-label="Column '+(i%7+1)+'"></button>').join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>drop(+b.dataset.col));document.getElementById('cstatus').textContent=done?'Game finished':(turn===1?'Red':'Yellow')+' turn'}function drop(col){if(done)return;for(let r=5;r>=0;r--){let i=r*7+col;if(!a[i]){a[i]=turn;let dirs=[[0,1],[1,0],[1,1],[1,-1]],won=dirs.some(([dr,dc])=>{let n=1;for(let s of [-1,1]){let rr=r+dr*s,cc=col+dc*s;while(rr>=0&&rr<6&&cc>=0&&cc<7&&a[rr*7+cc]===turn){n++;rr+=dr*s;cc+=dc*s}}return n>=4});if(won||a.every(Boolean)){done=true;document.getElementById('cresult').textContent=won?(turn===1?'Red':'Yellow')+' wins! 🎉':'Draw!'}else turn=3-turn;draw();return}}}document.getElementById('crestart').onclick=()=>{a.fill(0);turn=1;done=false;document.getElementById('cresult').textContent='';draw()};draw()}
function gameReaction(){const body='<div id="rstatus">Players: get ready…</div><div style="padding:35px 8px"><button id="react" class="tapbtn">START DUEL</button></div><div id="rresult" class="score"></div><p class="hint">Player 1 taps the left side, Player 2 taps the right side after GO appears.</p>';shell('Reaction Duel','A quick two-player reflex challenge.',body);let phase='idle',timer=null,start=0;const btn=document.getElementById('react'),status=document.getElementById('rstatus'),result=document.getElementById('rresult');function begin(){phase='wait';btn.textContent='WAIT…';btn.style.background='#6c527e';status.textContent='Wait for the green signal';result.textContent='';timer=setTimeout(()=>{phase='go';start=Date.now();btn.textContent='GO! TAP NOW';btn.style.background='#168b70';status.textContent='Tap your side!'},1200+Math.random()*2600)}btn.onclick=e=>{if(phase==='idle'||phase==='done'){begin();return}if(phase==='wait'){clearTimeout(timer);phase='done';result.textContent='Too early! False start. Try again.';btn.textContent='TRY AGAIN';return}if(phase==='go'){let who=e.offsetX<btn.clientWidth/2?'Player 1':'Player 2';phase='done';result.textContent=who+' wins in '+(Date.now()-start)+' ms!';btn.textContent='PLAY AGAIN'}};cleanup=()=>clearTimeout(timer)}
function gameMaze(){const body='<div class="score" id="mstatus">Find the golden exit ✨</div><div class="maze" id="maze"></div><div class="controls"><button data-m="up">▲</button><button data-m="left">◀</button><button data-m="down">▼</button><button data-m="right">▶</button></div><button class="secondary" id="mnew">New maze</button><p class="hint">Use the arrows or keyboard to move.</p>';shell('Maze Quest','Explore the maze and reach the exit.',body);const N=9,el=document.getElementById('maze');let walls=[],p=0,goal=80,moves=0;function make(){walls=Array(N*N).fill(true);let stack=[0];walls[0]=false;while(stack.length){let cur=stack[stack.length-1],r=Math.floor(cur/N),c=cur%N,opts=[[r-2,c,cur-2*N,cur-N],[r+2,c,cur+2*N,cur+N],[r,c-2,cur-2,cur-1],[r,c+2,cur+2,cur+1]].filter(([rr,cc])=>rr>=0&&rr<N&&cc>=0&&cc<N&&walls[rr*N+cc]);if(!opts.length){stack.pop();continue}let [rr,cc,next,mid]=opts[Math.floor(Math.random()*opts.length)];walls[mid]=false;walls[next]=false;stack.push(next)}walls[0]=false;walls[80]=false;p=0;moves=0;draw()}function draw(){el.innerHTML=walls.map((w,i)=>'<span class="'+(w?'wall':i===p?'player':i===goal?'goal':'')+'"></span>').join('');document.getElementById('mstatus').textContent=p===goal?'You escaped in '+moves+' moves! 🎉':'Moves: '+moves+' · Reach the gold exit'}function move(d){let r=Math.floor(p/N),c=p%N,rr=r+(d==='down'?1:d==='up'?-1:0),cc=c+(d==='right'?1:d==='left'?-1:0);if(rr<0||rr>=N||cc<0||cc>=N)return;let q=rr*N+cc;if(!walls[q]){p=q;moves++;draw()}}document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>move(b.dataset.m));const key=e=>{let d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(d){e.preventDefault();move(d)}};document.addEventListener('keydown',key);document.getElementById('mnew').onclick=make;make();cleanup=()=>document.removeEventListener('keydown',key)}
function gameSnake(){const body='<div class="score" id="sscore">Score: 0</div><canvas class="canvas" id="snakeCanvas" width="340" height="340"></canvas><div><button class="secondary" id="sstart">Start / Restart</button></div><p class="hint">Swipe or use arrow keys. Collect dots and avoid your tail.</p>';shell('Snake Run','A classic endless adventure.',body);const c=document.getElementById('snakeCanvas'),ctx=c.getContext('2d');let snake,dir,food,score,timer,over;function reset(){clearInterval(timer);snake=[{x:8,y:8},{x:7,y:8},{x:6,y:8}];dir={x:1,y:0};food={x:14,y:10};score=0;over=false;draw();timer=setInterval(tick,125)}function draw(){ctx.fillStyle='#0c1020';ctx.fillRect(0,0,340,340);ctx.fillStyle='#f2bd69';ctx.fillRect(food.x*20+2,food.y*20+2,16,16);snake.forEach((p,i)=>{ctx.fillStyle=i?'#5de0bd':'#a8fff0';ctx.fillRect(p.x*20+1,p.y*20+1,18,18)});document.getElementById('sscore').textContent='Score: '+score+(over?' · Game over':'')}function tick(){let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=17||h.y>=17||snake.some(p=>p.x===h.x&&p.y===h.y)){over=true;clearInterval(timer);draw();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;food={x:Math.floor(Math.random()*17),y:Math.floor(Math.random()*17)}}else snake.pop();draw()}function steer(x,y){if(x!==-dir.x||y!==-dir.y)dir={x,y}}const key=e=>{let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(d&&play.classList.contains('show')){e.preventDefault();steer(...d)}};document.addEventListener('keydown',key);let sx=0,sy=0;c.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};c.ontouchend=e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>15)steer(Math.abs(dx)>Math.abs(dy)?dx>0?1:-1:0,Math.abs(dy)>Math.abs(dx)?dy>0?1:-1:0)};document.getElementById('sstart').onclick=reset;reset();cleanup=()=>{clearInterval(timer);document.removeEventListener('keydown',key)}}
function gameRace(){const body='<div id="racestatus">Choose a race mode</div><div class="racebar"><span id="racefill"></span></div><div class="score" id="racetime">10 seconds</div><button class="tapbtn" id="raceTap">🏁 TAP TO RACE</button><div><button class="secondary" id="raceSolo">Race the clock</button><button class="secondary" id="raceTwo">Two-player race</button></div><p class="hint">Solo: beat the finish line in 10 seconds. Two-player: alternate left and right taps.</p>';shell('Tap Racer','A tiny speed challenge.',body);let active=false,mode='solo',left=0,right=0,started=0,interval=null;const tap=document.getElementById('raceTap'),fill=document.getElementById('racefill'),status=document.getElementById('racestatus'),time=document.getElementById('racetime');function stop(){clearInterval(interval);active=false}function start(m){stop();mode=m;left=right=0;started=Date.now();active=true;status.textContent=m==='solo'?'Tap quickly to reach 100!':'Player 1 starts — tap left/right alternately';fill.style.width='0%';time.textContent='10 seconds';interval=setInterval(()=>{let remain=Math.max(0,10-(Date.now()-started)/1000);time.textContent=remain.toFixed(1)+' seconds';if(remain<=0){stop();status.textContent=m==='solo'?(left>=100?'Finish! You won!':'Time! Try again.'):(left===right?'It is a tie!':left>right?'Player 1 wins!':'Player 2 wins!')}},100)}tap.onclick=e=>{if(!active){start(mode);return}if(mode==='solo'){left=Math.min(100,left+4);fill.style.width=left+'%';if(left>=100){stop();status.textContent='🏆 Finish line reached!'}}else{let side=e.offsetX<tap.clientWidth/2?'left':'right';if(side==='left')left=Math.min(100,left+5);else right=Math.min(100,right+5);fill.style.width=Math.max(left,right)+'%';status.textContent='Player 1: '+left+'% · Player 2: '+right+'%';if(left>=100||right>=100){stop();status.textContent=left===right?'Tie!':left>right?'Player 1 wins!':'Player 2 wins!'}}};document.getElementById('raceSolo').onclick=()=>{mode='solo';start('solo')};document.getElementById('raceTwo').onclick=()=>{mode='two';start('two')};cleanup=stop}
function game2048(){let a=Array(16).fill(0),score=0;const body='<div class="score">Score: <b id="score">0</b></div><div class="board grid4" id="board"></div><button class="secondary" id="reset">New game</button><p class="hint">Swipe or use arrow keys to move tiles.</p>';shell('2048','Join matching numbers and reach 2048.',body);const board=document.getElementById('board');function add(){let e=a.map((v,i)=>v?null:i).filter(v=>v!==null);if(e.length)a[e[Math.floor(Math.random()*e.length)]]=Math.random()<.9?2:4}function draw(){board.innerHTML=a.map(v=>'<button class="cell '+(v?'filled':'')+'">'+(v||'')+'</button>').join('');document.getElementById('score').textContent=score}function move(dir){let old=a.join(',');for(let n=0;n<4;n++){let ids=Array.from({length:4},(_,i)=>dir==='left'?n*4+i:dir==='right'?n*4+3-i:dir==='up'?i*4+n:(3-i)*4+n),vals=ids.map(i=>a[i]).filter(Boolean),out=[];for(let i=0;i<vals.length;i++){if(vals[i]===vals[i+1]){out.push(vals[i]*2);score+=vals[i]*2;i++}else out.push(vals[i])}while(out.length<4)out.push(0);ids.forEach((id,i)=>a[id]=out[i])}if(old!==a.join(',')){add();draw()}}const key=e=>{let d={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(d&&play.classList.contains('show')){e.preventDefault();move(d)}};document.addEventListener('keydown',key);let sx=0,sy=0;board.ontouchstart=e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY};board.ontouchend=e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>20)move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')};document.getElementById('reset').onclick=()=>{a.fill(0);score=0;add();add();draw()};add();add();draw();cleanup=()=>document.removeEventListener('keydown',key)}
function gameMemory(){const icons=['🍉','🍋','🍇','🍓','🥝','🍒','🍍','🥑'];let deck=[...icons,...icons].sort(()=>Math.random()-.5),open=[],matched=0,locked=false,moves=0;const body='<div class="score" id="memscore">Pairs: 0 / 8 · Moves: 0</div><div class="memory" id="memory"></div><button class="secondary" id="memreset">Shuffle</button>';shell('Memory Match','Flip cards and find all eight pairs.',body);const el=document.getElementById('memory');function draw(){el.innerHTML=deck.map((v,i)=>'<button data-i="'+i+'">'+(open.includes(i)||matchedCards.includes(i)?v:'?')+'</button>').join('');el.querySelectorAll('button').forEach(b=>b.onclick=()=>flip(+b.dataset.i));document.getElementById('memscore').textContent='Pairs: '+matched+' / 8 · Moves: '+moves}let matchedCards=[];function flip(i){if(locked||open.includes(i)||matchedCards.includes(i))return;open.push(i);if(open.length===2){moves++;if(deck[open[0]]===deck[open[1]]){matched++;matchedCards.push(...open);open=[]}else{locked=true;let pair=[...open];draw();setTimeout(()=>{open=[];locked=false;draw()},650);return}}draw()}document.getElementById('memreset').onclick=()=>{deck=[...icons,...icons].sort(()=>Math.random()-.5);open=[];matchedCards=[];matched=0;moves=0;locked=false;draw()};draw()}
function gameBubble(){const body='<div class="score" id="count">Popped: 0</div><div class="bubblearea" id="bubbles"></div><button class="secondary" id="refresh">New bubbles</button><p class="hint">No timer, no score pressure. Just pop at your own pace.</p>';shell('Bubble Pop','A little satisfying break.',body);let count=0;const area=document.getElementById('bubbles');function fill(){area.innerHTML=Array.from({length:15},()=>'<button class="bubble" aria-label="Pop bubble"></button>').join('');area.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(!b.classList.contains('popped')){b.classList.add('popped');count++;document.getElementById('count').textContent='Popped: '+count}})}document.getElementById('refresh').onclick=fill;fill()}
function gameColors(){const colors=['#ff6d83','#ffdc70','#5de0bd','#8b7cff'];let seq=[],pos=0,round=0,accept=false;const body='<div id="colorstatus">Watch the pattern, then repeat it.</div><div class="colorpad">'+colors.map((c,i)=>'<button data-color="'+i+'" style="background:'+c+'"></button>').join('')+'</div><button class="secondary" id="colorstart">Start</button><div class="score" id="colorresult"></div>';shell('Color Flow','A calm memory pattern game.',body);const buttons=[...document.querySelectorAll('[data-color]')];function flash(i){buttons[i].style.filter='brightness(1.7)';setTimeout(()=>buttons[i].style.filter='',260)}function next(){seq.push(Math.floor(Math.random()*4));pos=0;accept=false;document.getElementById('colorstatus').textContent='Watch '+seq.length+' color'+(seq.length===1?'':'s')+'…';seq.forEach((v,i)=>setTimeout(()=>flash(v),500+i*550));setTimeout(()=>{accept=true;document.getElementById('colorstatus').textContent='Your turn — repeat the pattern'},500+seq.length*550)}function start(){seq=[];round=0;document.getElementById('colorresult').textContent='';next()}buttons.forEach(b=>b.onclick=()=>{if(!accept)return;let v=+b.dataset.color;flash(v);if(v!==seq[pos]){accept=false;document.getElementById('colorresult').textContent='Nice try! You reached '+round+' rounds.';return}pos++;if(pos===seq.length){round++;accept=false;document.getElementById('colorresult').textContent='Round '+round+' complete!';setTimeout(next,650)}});document.getElementById('colorstart').onclick=start;cleanup=()=>{accept=false}}
