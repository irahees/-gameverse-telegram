services:
  - type: web
    name: gameverse-telegram
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: APP_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
